  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="870.3333333333333" y="553.51" width="48" height="21.49"><title>JCV 0.10, 100k pathological: median 23.10 ms</title></rect></g>
  <rect x="926.3333333333333" y="530.44" width="48" height="44.56" rx="4" fill="#14a38b"/>
