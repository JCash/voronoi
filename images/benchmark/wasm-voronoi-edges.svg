  <rect x="351.66666666666663" y="544.73" width="48" height="30.27" rx="4" fill="#b85bb4"/>
  <text x="375.66666666666663" y="522.73" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">32.55 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="351.66666666666663" y="544.73" width="48" height="30.27"><title>gorhill/voronoi, 10k: median 32.55 ms</title></rect></g>
  <text x="635" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">100k</text>
