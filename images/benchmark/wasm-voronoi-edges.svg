<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Voronoi diagram</title>
  <desc id="desc">Grouped bar chart comparing WebAssembly and JavaScript Voronoi libraries for 10k, 100k, and the 100k pathological case. Times are medians in milliseconds; lower is better. Bars above 500 milliseconds are truncated with a jagged top.</desc>
  <style>.stat-hit{fill:transparent;pointer-events:all}</style>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="70" y="49" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#152238">Voronoi diagram</text>
  <text x="70" y="76" font-family="system-ui, sans-serif" font-size="15" fill="#536174">Diagram generation + complete edge retrieval · median time · lower is better</text>
  <line x1="120" y1="575" x2="1150" y2="575" stroke="#d8dee8"/>
  <text x="108" y="580" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">0</text>
  <line x1="120" y1="482" x2="1150" y2="482" stroke="#d8dee8"/>
  <text x="108" y="487" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">100.00 ms</text>
  <line x1="120" y1="389" x2="1150" y2="389" stroke="#d8dee8"/>
  <text x="108" y="394" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">200.00 ms</text>
  <line x1="120" y1="296" x2="1150" y2="296" stroke="#d8dee8"/>
  <text x="108" y="301" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">300.00 ms</text>
  <line x1="120" y1="203" x2="1150" y2="203" stroke="#d8dee8"/>
  <text x="108" y="208" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">400.00 ms</text>
  <line x1="120" y1="110" x2="1150" y2="110" stroke="#d8dee8"/>
  <text x="108" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">500.00 ms</text>
  <text x="291.66666666666663" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">10k</text>
  <rect x="183.66666666666663" y="567.07" width="48" height="7.93" rx="4" fill="#5267d9"/>
  <text x="207.66666666666663" y="559.07" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">8.52 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="183.66666666666663" y="560.00" width="48" height="15.00"><title>JCV 0.10, 10k: median 8.52 ms</title></rect></g>
  <rect x="239.66666666666663" y="564.33" width="48" height="10.67" rx="4" fill="#14a38b"/>
  <text x="263.66666666666663" y="542.33" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">11.47 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="239.66666666666663" y="560.00" width="48" height="15.00"><title>d3-delaunay, 10k: median 11.47 ms</title></rect></g>
  <rect x="295.66666666666663" y="547.97" width="48" height="27.03" rx="4" fill="#e08b35"/>
  <text x="319.66666666666663" y="539.97" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">29.06 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="295.66666666666663" y="547.97" width="48" height="27.03"><title>d3-voronoi, 10k: median 29.06 ms</title></rect></g>
  <rect x="351.66666666666663" y="543.45" width="48" height="31.55" rx="4" fill="#b85bb4"/>
  <text x="375.66666666666663" y="521.45" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">33.92 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="351.66666666666663" y="543.45" width="48" height="31.55"><title>gorhill/voronoi, 10k: median 33.92 ms</title></rect></g>
  <text x="635" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">100k</text>
  <rect x="527" y="469.93" width="48" height="105.07" rx="4" fill="#5267d9"/>
  <text x="551" y="461.93" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">112.98 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="527" y="469.93" width="48" height="105.07"><title>JCV 0.10, 100k: median 112.98 ms</title></rect></g>
  <rect x="583" y="457.56" width="48" height="117.44" rx="4" fill="#14a38b"/>
  <text x="607" y="435.56" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">126.28 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="583" y="457.56" width="48" height="117.44"><title>d3-delaunay, 100k: median 126.28 ms</title></rect></g>
  <rect x="639" y="271.80" width="48" height="303.20" rx="4" fill="#e08b35"/>
  <text x="663" y="263.80" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">326.02 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="639" y="271.80" width="48" height="303.20"><title>d3-voronoi, 100k: median 326.02 ms</title></rect></g>
  <rect x="695" y="233.28" width="48" height="341.72" rx="4" fill="#b85bb4"/>
  <text x="719" y="211.28" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">367.44 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="695" y="233.28" width="48" height="341.72"><title>gorhill/voronoi, 100k: median 367.44 ms</title></rect></g>
  <text x="978.3333333333333" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">100k pathological</text>
  <rect x="870.3333333333333" y="542.03" width="48" height="32.97" rx="4" fill="#5267d9"/>
  <text x="894.3333333333333" y="534.03" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">35.45 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="870.3333333333333" y="542.03" width="48" height="32.97"><title>JCV 0.10, 100k pathological: median 35.45 ms</title></rect></g>
  <rect x="926.3333333333333" y="530.09" width="48" height="44.91" rx="4" fill="#14a38b"/>
  <text x="950.3333333333333" y="508.09" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">48.29 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="926.3333333333333" y="530.09" width="48" height="44.91"><title>d3-delaunay, 100k pathological: median 48.29 ms</title></rect></g>
  <rect x="982.3333333333333" y="468.63" width="48" height="106.37" rx="4" fill="#e08b35"/>
  <text x="1006.3333333333333" y="460.63" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">114.38 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="982.3333333333333" y="468.63" width="48" height="106.37"><title>d3-voronoi, 100k pathological: median 114.38 ms</title></rect></g>
  <path d="M1038.3333333333333 575 V120 L1046.3333333333333 110 L1054.3333333333333 120 L1062.3333333333333 110 L1070.3333333333333 120 L1078.3333333333333 110 L1086.3333333333333 120 V575 Z" fill="#b85bb4"/>
  <text x="1062.3333333333333" y="105.00" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">2.72 s</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="1038.3333333333333" y="110.00" width="48" height="465.00"><title>gorhill/voronoi, 100k pathological: median 2.72 s</title></rect></g>
  <rect x="180" y="660" width="16" height="16" rx="3" fill="#5267d9"/><text x="204" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">JCV 0.10</text>
  <rect x="390" y="660" width="16" height="16" rx="3" fill="#14a38b"/><text x="414" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">d3-delaunay</text>
  <rect x="600" y="660" width="16" height="16" rx="3" fill="#e08b35"/><text x="624" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">d3-voronoi</text>
  <rect x="810" y="660" width="16" height="16" rx="3" fill="#b85bb4"/><text x="834" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">gorhill/voronoi</text>
</svg>
