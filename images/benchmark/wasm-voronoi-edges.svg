  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="926.3333333333333" y="530.44" width="48" height="44.56"><title>d3-delaunay, 100k pathological: median 47.91 ms</title></rect></g>
  <rect x="982.3333333333333" y="468.62" width="48" height="106.38" rx="4" fill="#e08b35"/>
  <text x="1006.3333333333333" y="460.62" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">114.38 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="982.3333333333333" y="468.62" width="48" height="106.38"><title>d3-voronoi, 100k pathological: median 114.38 ms</title></rect></g>
  <path d="M1038.3333333333333 575 V120 L1046.3333333333333 110 L1054.3333333333333 120 L1062.3333333333333 110 L1070.3333333333333 120 L1078.3333333333333 110 L1086.3333333333333 120 V575 Z" fill="#b85bb4"/>
  <text x="1062.3333333333333" y="105.00" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">2.59 s</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="1038.3333333333333" y="110.00" width="48" height="465.00"><title>gorhill/voronoi, 100k pathological: median 2.59 s</title></rect></g>
