  <rect x="583" y="474.51" width="48" height="100.49" rx="4" fill="#14a38b"/>
  <text x="607" y="452.51" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">108.06 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="583" y="474.51" width="48" height="100.49"><title>d3-delaunay, 100k: median 108.06 ms</title></rect></g>
  <rect x="639" y="328.39" width="48" height="246.61" rx="4" fill="#e08b35"/>
  <text x="663" y="320.39" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">265.17 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="639" y="328.39" width="48" height="246.61"><title>d3-voronoi, 100k: median 265.17 ms</title></rect></g>
  <rect x="695" y="221.04" width="48" height="353.96" rx="4" fill="#b85bb4"/>
  <text x="719" y="199.04" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">380.60 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="695" y="221.04" width="48" height="353.96"><title>gorhill/voronoi, 100k: median 380.60 ms</title></rect></g>
  <text x="978.3333333333333" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">100k pathological</text>
