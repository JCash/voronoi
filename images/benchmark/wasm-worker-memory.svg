  <text x="70" y="76" font-family="system-ui, sans-serif" font-size="15" fill="#536174">Input + WASM heap + packed result at peak · packed result retained · lower is better</text>
  <line x1="115" y1="575" x2="1150" y2="575" stroke="#d8dee8"/>
  <text x="103" y="580" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">0</text>
