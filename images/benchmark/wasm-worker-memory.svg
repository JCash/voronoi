<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Worker-backed JCV Memory</title>
  <desc id="desc">Peak tracked worker payload and retained packed diagram memory after terminating the worker. Lower is better.</desc>
  <style>.stat-hit{fill:transparent;pointer-events:all}</style>
  <rect width="1200" height="720" fill="#f8fafc"/>
