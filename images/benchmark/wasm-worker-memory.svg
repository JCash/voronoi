  <text x="103" y="487" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">19.1 MiB</text>
  <line x1="115" y1="389" x2="1150" y2="389" stroke="#d8dee8"/>
  <text x="103" y="394" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">38.1 MiB</text>
