<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Retained WebAssembly and JavaScript Memory</title>
  <desc id="desc">Grouped bar chart comparing median retained resident-memory deltas after generating one diagram in a fresh Node.js process. Lower is better.</desc>
  <style>.stat-hit{fill:transparent;pointer-events:all}</style>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="70" y="49" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#152238">Retained WebAssembly and JavaScript Memory</text>
  <text x="70" y="76" font-family="system-ui, sans-serif" font-size="15" fill="#536174">Fresh process · public diagram API · median retained RSS delta · lower is better</text>
  <line x1="115" y1="575" x2="1150" y2="575" stroke="#d8dee8"/>
  <text x="103" y="580" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">0</text>
  <line x1="115" y1="482" x2="1150" y2="482" stroke="#d8dee8"/>
  <text x="103" y="487" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">76.3 MiB</text>
  <line x1="115" y1="389" x2="1150" y2="389" stroke="#d8dee8"/>
  <text x="103" y="394" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">152.6 MiB</text>
  <line x1="115" y1="296" x2="1150" y2="296" stroke="#d8dee8"/>
  <text x="103" y="301" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">228.9 MiB</text>
  <line x1="115" y1="203" x2="1150" y2="203" stroke="#d8dee8"/>
  <text x="103" y="208" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">305.2 MiB</text>
  <line x1="115" y1="110" x2="1150" y2="110" stroke="#d8dee8"/>
  <text x="103" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">381.5 MiB</text>
  <text x="287.5" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">10k</text>
  <rect x="179.5" y="562.89" width="48" height="12.11" rx="4" fill="#5267d9"/>
  <text x="203.5" y="554.89" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">9.9 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="179.5" y="560.00" width="48" height="15.00"><title>JCV 0.10, 10k: median retained 9.9 MiB</title></rect></g>
  <rect x="235.5" y="567.88" width="48" height="7.12" rx="4" fill="#14a38b"/>
  <text x="259.5" y="545.88" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">5.8 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="235.5" y="560.00" width="48" height="15.00"><title>d3-delaunay, 10k: median retained 5.8 MiB</title></rect></g>
  <rect x="291.5" y="536.75" width="48" height="38.25" rx="4" fill="#e08b35"/>
  <text x="315.5" y="528.75" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">31.4 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="291.5" y="536.75" width="48" height="38.25"><title>d3-voronoi, 10k: median retained 31.4 MiB</title></rect></g>
  <rect x="347.5" y="526.49" width="48" height="48.51" rx="4" fill="#b85bb4"/>
  <text x="371.5" y="504.49" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">39.8 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="347.5" y="526.49" width="48" height="48.51"><title>gorhill/voronoi, 10k: median retained 39.8 MiB</title></rect></g>
  <text x="632.5" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">100k</text>
  <rect x="524.5" y="506.78" width="48" height="68.22" rx="4" fill="#5267d9"/>
  <text x="548.5" y="498.78" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">56.0 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="524.5" y="506.78" width="48" height="68.22"><title>JCV 0.10, 100k: median retained 56.0 MiB</title></rect></g>
  <rect x="580.5" y="553.13" width="48" height="21.87" rx="4" fill="#14a38b"/>
  <text x="604.5" y="531.13" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">17.9 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="580.5" y="553.13" width="48" height="21.87"><title>d3-delaunay, 100k: median retained 17.9 MiB</title></rect></g>
  <rect x="636.5" y="373.79" width="48" height="201.21" rx="4" fill="#e08b35"/>
  <text x="660.5" y="365.79" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">165.1 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="636.5" y="373.79" width="48" height="201.21"><title>d3-voronoi, 100k: median retained 165.1 MiB</title></rect></g>
  <rect x="692.5" y="364.14" width="48" height="210.86" rx="4" fill="#b85bb4"/>
  <text x="716.5" y="342.14" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">173.0 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="692.5" y="364.14" width="48" height="210.86"><title>gorhill/voronoi, 100k: median retained 173.0 MiB</title></rect></g>
  <text x="977.5" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">100k pathological</text>
  <rect x="869.5" y="501.65" width="48" height="73.35" rx="4" fill="#5267d9"/>
  <text x="893.5" y="493.65" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">60.2 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="869.5" y="501.65" width="48" height="73.35"><title>JCV 0.10, 100k pathological: median retained 60.2 MiB</title></rect></g>
  <rect x="925.5" y="555.67" width="48" height="19.33" rx="4" fill="#14a38b"/>
  <text x="949.5" y="533.67" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">15.9 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="925.5" y="555.67" width="48" height="19.33"><title>d3-delaunay, 100k pathological: median retained 15.9 MiB</title></rect></g>
  <rect x="981.5" y="377.53" width="48" height="197.47" rx="4" fill="#e08b35"/>
  <text x="1005.5" y="369.53" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">162.0 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="981.5" y="377.53" width="48" height="197.47"><title>d3-voronoi, 100k pathological: median retained 162.0 MiB</title></rect></g>
  <rect x="1037.5" y="353.78" width="48" height="221.22" rx="4" fill="#b85bb4"/>
  <text x="1061.5" y="331.78" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">181.5 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="1037.5" y="353.78" width="48" height="221.22"><title>gorhill/voronoi, 100k pathological: median retained 181.5 MiB</title></rect></g>
  <rect x="180" y="660" width="16" height="16" rx="3" fill="#5267d9"/><text x="204" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">JCV 0.10</text>
  <rect x="390" y="660" width="16" height="16" rx="3" fill="#14a38b"/><text x="414" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">d3-delaunay</text>
  <rect x="600" y="660" width="16" height="16" rx="3" fill="#e08b35"/><text x="624" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">d3-voronoi</text>
  <rect x="810" y="660" width="16" height="16" rx="3" fill="#b85bb4"/><text x="834" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">gorhill/voronoi</text>
</svg>
