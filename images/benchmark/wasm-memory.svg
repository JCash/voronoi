<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Peak and Retained WebAssembly and JavaScript Memory</title>
  <desc id="desc">Grouped bar chart comparing peak and retained resident-memory deltas. Each pale bar shows peak memory and its darker lower portion shows retained memory.</desc>
