<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Worker-backed JCV Memory</title>
  <desc id="desc">Each pale bar shows peak tracked worker payload and its darker lower portion shows retained packed diagram memory after terminating the worker.</desc>
  <style>.stat-hit{fill:transparent;pointer-events:all}</style>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="70" y="49" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#152238">Worker-backed JCV Memory</text>
  <text x="70" y="76" font-family="system-ui, sans-serif" font-size="15" fill="#536174">Darker portion is retained · lower is better</text>
  <line x1="115" y1="575" x2="1150" y2="575" stroke="#d8dee8"/>
  <text x="103" y="580" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">0</text>
  <line x1="115" y1="482" x2="1150" y2="482" stroke="#d8dee8"/>
  <text x="103" y="487" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">19.1 MiB</text>
  <line x1="115" y1="389" x2="1150" y2="389" stroke="#d8dee8"/>
  <text x="103" y="394" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">38.1 MiB</text>
  <line x1="115" y1="296" x2="1150" y2="296" stroke="#d8dee8"/>
  <text x="103" y="301" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">57.2 MiB</text>
  <line x1="115" y1="203" x2="1150" y2="203" stroke="#d8dee8"/>
  <text x="103" y="208" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">76.3 MiB</text>
  <line x1="115" y1="110" x2="1150" y2="110" stroke="#d8dee8"/>
  <text x="103" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">95.4 MiB</text>
  <text x="287.5" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">10k</text>
  <rect x="242.5" y="490.80" width="90" height="84.20" rx="4" fill="#aeb8f2"/>
  <rect x="242.5" y="569.80" width="90" height="5.20" rx="4" fill="#5267d9"/>
  <text x="287.5" y="468.80" font-family="system-ui, sans-serif" font-size="11" font-weight="650" fill="#35445a" text-anchor="middle">17.3 MiB</text>
  <text x="287.5" y="482.80" font-family="system-ui, sans-serif" font-size="11" fill="#5267d9" text-anchor="middle">1.1 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="242.5" y="490.80" width="90" height="84.20"><title>10k: peak 17.3 MiB; retained 1.1 MiB</title></rect></g>
  <text x="632.5" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">100k</text>
  <rect x="587.5" y="326.62" width="90" height="248.38" rx="4" fill="#aeb8f2"/>
  <rect x="587.5" y="522.94" width="90" height="52.06" rx="4" fill="#5267d9"/>
  <text x="632.5" y="304.62" font-family="system-ui, sans-serif" font-size="11" font-weight="650" fill="#35445a" text-anchor="middle">50.9 MiB</text>
  <text x="632.5" y="318.62" font-family="system-ui, sans-serif" font-size="11" fill="#5267d9" text-anchor="middle">10.7 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="587.5" y="326.62" width="90" height="248.38"><title>100k: peak 50.9 MiB; retained 10.7 MiB</title></rect></g>
  <text x="977.5" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">100k pathological</text>
  <rect x="932.5" y="286.67" width="90" height="288.33" rx="4" fill="#aeb8f2"/>
  <rect x="932.5" y="529.31" width="90" height="45.69" rx="4" fill="#5267d9"/>
  <text x="977.5" y="264.67" font-family="system-ui, sans-serif" font-size="11" font-weight="650" fill="#35445a" text-anchor="middle">59.1 MiB</text>
  <text x="977.5" y="278.67" font-family="system-ui, sans-serif" font-size="11" fill="#5267d9" text-anchor="middle">9.4 MiB</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="932.5" y="286.67" width="90" height="288.33"><title>100k pathological: peak 59.1 MiB; retained 9.4 MiB</title></rect></g>
  <rect x="485" y="651" width="42" height="20" rx="3" fill="#aeb8f2"/>
  <rect x="485" y="660" width="42" height="11" rx="2" fill="#5267d9"/>
  <text x="537" y="667" font-family="system-ui, sans-serif" font-size="14" fill="#344258">peak / retained</text>
</svg>
