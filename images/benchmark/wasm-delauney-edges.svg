<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Delauney diagram</title>
  <desc id="desc">Grouped bar chart comparing WebAssembly and JavaScript Voronoi libraries for 10k, 100k, and the 100k pathological case. Times are medians in milliseconds; lower is better. Bars above 500 milliseconds are truncated with a jagged top.</desc>
  <style>.stat-hit{fill:transparent;pointer-events:all}</style>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="70" y="49" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#152238">Delauney diagram</text>
  <text x="70" y="76" font-family="system-ui, sans-serif" font-size="15" fill="#536174">Diagram generation + complete edge retrieval · median time · lower is better</text>
  <line x1="120" y1="575" x2="1150" y2="575" stroke="#d8dee8"/>
  <text x="108" y="580" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">0</text>
  <line x1="120" y1="482" x2="1150" y2="482" stroke="#d8dee8"/>
  <text x="108" y="487" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">100.00 ms</text>
  <line x1="120" y1="389" x2="1150" y2="389" stroke="#d8dee8"/>
  <text x="108" y="394" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">200.00 ms</text>
  <line x1="120" y1="296" x2="1150" y2="296" stroke="#d8dee8"/>
  <text x="108" y="301" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">300.00 ms</text>
  <line x1="120" y1="203" x2="1150" y2="203" stroke="#d8dee8"/>
  <text x="108" y="208" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">400.00 ms</text>
  <line x1="120" y1="110" x2="1150" y2="110" stroke="#d8dee8"/>
  <text x="108" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">500.00 ms</text>
  <text x="291.66666666666663" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">10k</text>
  <rect x="211.66666666666663" y="571.10" width="48" height="3.90" rx="4" fill="#5267d9"/>
  <text x="235.66666666666663" y="563.10" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">4.19 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="211.66666666666663" y="560.00" width="48" height="15.00"><title>JCV 0.10, 10k: median 4.19 ms</title></rect></g>
  <rect x="267.66666666666663" y="569.38" width="48" height="5.62" rx="4" fill="#14a38b"/>
  <text x="291.66666666666663" y="547.38" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">6.04 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="267.66666666666663" y="560.00" width="48" height="15.00"><title>d3-delaunay, 10k: median 6.04 ms</title></rect></g>
  <rect x="323.66666666666663" y="546.33" width="48" height="28.67" rx="4" fill="#e08b35"/>
  <text x="347.66666666666663" y="538.33" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">30.83 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="323.66666666666663" y="546.33" width="48" height="28.67"><title>d3-voronoi, 10k: median 30.83 ms</title></rect></g>
  <text x="635" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">100k</text>
  <rect x="555" y="532.53" width="48" height="42.47" rx="4" fill="#5267d9"/>
  <text x="579" y="524.53" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">45.66 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="555" y="532.53" width="48" height="42.47"><title>JCV 0.10, 100k: median 45.66 ms</title></rect></g>
  <rect x="611" y="530.60" width="48" height="44.40" rx="4" fill="#14a38b"/>
  <text x="635" y="508.60" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">47.74 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="611" y="530.60" width="48" height="44.40"><title>d3-delaunay, 100k: median 47.74 ms</title></rect></g>
  <rect x="667" y="220.97" width="48" height="354.03" rx="4" fill="#e08b35"/>
  <text x="691" y="212.97" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">380.67 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="667" y="220.97" width="48" height="354.03"><title>d3-voronoi, 100k: median 380.67 ms</title></rect></g>
  <text x="978.3333333333333" y="612" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#26354a" text-anchor="middle">100k pathological</text>
  <rect x="898.3333333333333" y="559.56" width="48" height="15.44" rx="4" fill="#5267d9"/>
  <text x="922.3333333333333" y="551.56" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">16.60 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="898.3333333333333" y="559.56" width="48" height="15.44"><title>JCV 0.10, 100k pathological: median 16.60 ms</title></rect></g>
  <rect x="954.3333333333333" y="552.85" width="48" height="22.15" rx="4" fill="#14a38b"/>
  <text x="978.3333333333333" y="530.85" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">23.82 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="954.3333333333333" y="552.85" width="48" height="22.15"><title>d3-delaunay, 100k pathological: median 23.82 ms</title></rect></g>
  <rect x="1010.3333333333333" y="471.77" width="48" height="103.23" rx="4" fill="#e08b35"/>
  <text x="1034.3333333333333" y="463.77" font-family="system-ui, sans-serif" font-size="10" font-weight="650" fill="#35445a" text-anchor="middle">111.00 ms</text>
  <g class="stat-bar" tabindex="0"><rect class="stat-hit" x="1010.3333333333333" y="471.77" width="48" height="103.23"><title>d3-voronoi, 100k pathological: median 111.00 ms</title></rect></g>
  <rect x="285" y="660" width="16" height="16" rx="3" fill="#5267d9"/><text x="309" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">JCV 0.10</text>
  <rect x="495" y="660" width="16" height="16" rx="3" fill="#14a38b"/><text x="519" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">d3-delaunay</text>
  <rect x="705" y="660" width="16" height="16" rx="3" fill="#e08b35"/><text x="729" y="674" font-family="system-ui, sans-serif" font-size="14" fill="#344258">d3-voronoi</text>
</svg>
