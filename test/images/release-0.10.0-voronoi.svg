    <rect class="stat-hit" x="426" y="554" width="52" height="21"><title>JCV 0.9, 10k: median 5.04 ms</title></rect>
    <g class="stat-tip" transform="translate(385 480)"><rect class="tip-box" width="178" height="52" rx="5"/><text class="tip-head" x="10" y="20">JCV 0.9 · 10k</text><text class="tip-value" x="10" y="40">Median: 5.04 ms</text></g>
  </g>
  <g class="stat-bar" tabindex="0">
    <rect class="stat-hit" x="484" y="560" width="52" height="15"><title>JCV 0.10, 10k: median 4.87 ms</title></rect>
    <g class="stat-tip" transform="translate(443 486)"><rect class="tip-box" width="178" height="52" rx="5"/><text class="tip-head" x="10" y="20">JCV 0.10 · 10k</text><text class="tip-value" x="10" y="40">Median: 4.87 ms</text></g>
  </g>
  <g class="stat-bar" tabindex="0">
    <rect class="stat-hit" x="542" y="554" width="52" height="21"><title>Boost 1.92.0, 10k: median 6.82 ms</title></rect>
    <g class="stat-tip" transform="translate(501 480)"><rect class="tip-box" width="178" height="52" rx="5"/><text class="tip-head" x="10" y="20">Boost 1.92.0 · 10k</text><text class="tip-value" x="10" y="40">Median: 6.82 ms</text></g>
  </g>

  <g class="stat-bar" tabindex="0">
    <rect class="stat-hit" x="676" y="415" width="52" height="160"><title>JCV 0.9, 100k: median 51.22 ms</title></rect>
    <g class="stat-tip" transform="translate(607 340)"><rect class="tip-box" width="190" height="52" rx="5"/><text class="tip-head" x="10" y="20">JCV 0.9 · 100k</text><text class="tip-value" x="10" y="40">Median: 51.22 ms</text></g>
  </g>
  <g class="stat-bar" tabindex="0">
    <rect class="stat-hit" x="734" y="406" width="52" height="169"><title>JCV 0.10, 100k: median 53.95 ms</title></rect>
    <g class="stat-tip" transform="translate(665 331)"><rect class="tip-box" width="190" height="52" rx="5"/><text class="tip-head" x="10" y="20">JCV 0.10 · 100k</text><text class="tip-value" x="10" y="40">Median: 53.95 ms</text></g>
  </g>
  <g class="stat-bar" tabindex="0">
    <rect class="stat-hit" x="792" y="324" width="52" height="251"><title>Boost 1.92.0, 100k: median 80.21 ms</title></rect>
    <g class="stat-tip" transform="translate(735 249)"><rect class="tip-box" width="190" height="52" rx="5"/><text class="tip-head" x="10" y="20">Boost 1.92.0 · 100k</text><text class="tip-value" x="10" y="40">Median: 80.21 ms</text></g>
  </g>

  <g class="stat-bar" tabindex="0">
    <rect class="stat-hit" x="926" y="105" width="52" height="470"><title>JCV 0.9, 100k pathological: median 9.15 s</title></rect>
    <g class="stat-tip" transform="translate(842 125)"><rect class="tip-box" width="220" height="52" rx="5"/><text class="tip-head" x="10" y="20">JCV 0.9 · 100k pathological</text><text class="tip-value" x="10" y="40">Median: 9.15 s</text></g>
