  <g class="stat-bar" tabindex="0">
    <rect class="stat-hit" x="984" y="517" width="52" height="58"><title>JCV 0.10, 100k pathological: median 18.63 ms</title></rect>
    <g class="stat-tip" transform="translate(875 442)"><rect class="tip-box" width="232" height="52" rx="5"/><text class="tip-head" x="10" y="20">JCV 0.10 · 100k pathological</text><text class="tip-value" x="10" y="40">Median: 18.63 ms</text></g>
  </g>
  <g class="stat-bar" tabindex="0">
    <rect class="stat-hit" x="1042" y="452" width="52" height="123"><title>Boost 1.92.0, 100k pathological: median 39.25 ms</title></rect>
    <g class="stat-tip" transform="translate(900 377)"><rect class="tip-box" width="234" height="52" rx="5"/><text class="tip-head" x="10" y="20">Boost 1.92.0 · 100k pathological</text><text class="tip-value" x="10" y="40">Median: 39.25 ms</text></g>
