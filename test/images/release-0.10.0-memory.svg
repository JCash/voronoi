<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Peak and retained heap memory</title>
  <desc id="desc">Grouped bar chart comparing heap memory for jc_voronoi 0.9.0, jc_voronoi 0.10.0, and Boost 1.92.0. Each light bar shows peak heap and its darker lower portion shows retained diagram heap.</desc>
  <style>
    .stat-bar .stat-tip { opacity: 0; pointer-events: none; }
    .stat-bar:hover .stat-tip, .stat-bar:focus .stat-tip { opacity: 1; }
    .stat-hit { fill: transparent; pointer-events: all; }
    .tip-box { fill: #152238; stroke: #ffffff; stroke-width: 1; }
    .tip-head { fill: #ffffff; font: 650 12px system-ui, sans-serif; }
    .tip-value { fill: #dce5f2; font: 12px system-ui, sans-serif; }
  </style>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="70" y="49" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#152238">Peak and retained heap</text>
  <text x="70" y="76" font-family="system-ui, sans-serif" font-size="15" fill="#536174">MiB per generated diagram · darker portion is retained · lower is better · hover bars for details</text>

  <g stroke="#d8dee8" stroke-width="1">
    <line x1="120" y1="575" x2="1150" y2="575"/>
    <line x1="120" y1="497" x2="1150" y2="497"/>
    <line x1="120" y1="418" x2="1150" y2="418"/>
    <line x1="120" y1="340" x2="1150" y2="340"/>
    <line x1="120" y1="262" x2="1150" y2="262"/>
    <line x1="120" y1="183" x2="1150" y2="183"/>
    <line x1="120" y1="105" x2="1150" y2="105"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#536174" text-anchor="end">
    <text x="108" y="580">0</text><text x="108" y="502">10</text><text x="108" y="423">20</text>
    <text x="108" y="345">30</text><text x="108" y="267">40</text><text x="108" y="188">50</text><text x="108" y="110">60 MiB</text>
  </g>

  <!-- Peak bars use pale tones; retained memory overlays the same bars in darker tones. -->
  <g>
    <rect x="176" y="571" width="52" height="4" rx="2" fill="#aeb8f2"/><rect x="176" y="571" width="52" height="4" rx="2" fill="#5267d9"/>
    <rect x="234" y="572" width="52" height="3" rx="2" fill="#91d9cd"/><rect x="234" y="573" width="52" height="2" rx="1" fill="#138875"/>
    <rect x="292" y="572" width="52" height="3" rx="2" fill="#f3c693"/><rect x="292" y="572" width="52" height="3" rx="1" fill="#c66f20"/>

    <rect x="426" y="538" width="52" height="37" rx="3" fill="#aeb8f2"/><rect x="426" y="538" width="52" height="37" rx="3" fill="#5267d9"/>
    <rect x="484" y="543" width="52" height="32" rx="3" fill="#91d9cd"/><rect x="484" y="554" width="52" height="21" rx="2" fill="#138875"/>
    <rect x="542" y="541" width="52" height="34" rx="3" fill="#f3c693"/><rect x="542" y="547" width="52" height="28" rx="2" fill="#c66f20"/>

    <rect x="676" y="207" width="52" height="368" rx="4" fill="#aeb8f2"/><rect x="676" y="207" width="52" height="368" rx="4" fill="#5267d9"/>
    <rect x="734" y="258" width="52" height="317" rx="4" fill="#91d9cd"/><rect x="734" y="371" width="52" height="204" rx="3" fill="#138875"/>
    <rect x="792" y="253" width="52" height="322" rx="4" fill="#f3c693"/><rect x="792" y="294" width="52" height="281" rx="3" fill="#c66f20"/>

    <rect x="926" y="221" width="52" height="354" rx="4" fill="#aeb8f2"/><rect x="926" y="221" width="52" height="354" rx="4" fill="#5267d9"/>
    <rect x="984" y="227" width="52" height="348" rx="4" fill="#91d9cd"/><rect x="984" y="305" width="52" height="270" rx="3" fill="#138875"/>
    <rect x="1042" y="131" width="52" height="444" rx="4" fill="#f3c693"/><rect x="1042" y="294" width="52" height="281" rx="3" fill="#c66f20"/>
  </g>

