  <g font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
    <text x="202" y="545" fill="#35445a" font-weight="650">0.49</text><text x="202" y="557" fill="#5267d9">0.49</text>
    <text x="260" y="545" fill="#35445a" font-weight="650">0.44</text><text x="260" y="557" fill="#138875">0.28</text>
