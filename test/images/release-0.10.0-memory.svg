    <text x="510" y="517" fill="#35445a" font-weight="650">4.08</text><text x="510" y="529" fill="#138875">2.64</text>
    <text x="568" y="515" fill="#35445a" font-weight="650">4.29</text><text x="568" y="527" fill="#c66f20">3.59</text>

    <text x="702" y="181" fill="#35445a" font-weight="650">46.93</text><text x="702" y="193" fill="#5267d9">46.93</text>
    <text x="760" y="232" fill="#35445a" font-weight="650">40.46</text><text x="760" y="244" fill="#138875">26.04</text>
    <text x="818" y="227" fill="#35445a" font-weight="650">41.12</text><text x="818" y="239" fill="#c66f20">35.86</text>

    <text x="952" y="195" fill="#35445a" font-weight="650">45.15</text><text x="952" y="207" fill="#5267d9">45.15</text>
    <text x="1010" y="201" fill="#35445a" font-weight="650">44.40</text><text x="1010" y="213" fill="#138875">34.46</text>
    <text x="1068" y="105" fill="#35445a" font-weight="650">56.64</text><text x="1068" y="117" fill="#c66f20">35.86</text>
  </g>

  <g font-family="system-ui, sans-serif" fill="#26354a" text-anchor="middle">
    <text x="260" y="612" font-size="15" font-weight="600">1k</text>
