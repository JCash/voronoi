name: Release npm package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.3"
          actions-cache-folder: emsdk-cache

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Build npm package
        env:
          WASM_OUTPUT_DIR: ../dist/jc_voronoi
        run: |
          ./scripts/build_wasm.sh dist/jc_voronoi
          node test/wasm_smoke.mjs

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/generate_changelog.sh
          cp CHANGELOG.md dist/jc_voronoi/CHANGELOG.md

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: npm pkg set "version=${PACKAGE_VERSION#v}" --prefix dist/jc_voronoi

      - name: Verify npm package
        run: npm pack --dry-run ./dist/jc_voronoi

      - name: Create release archive
        run: (cd dist && zip -r jc_voronoi.zip jc_voronoi)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jc_voronoi
          path: dist/jc_voronoi/

      - name: Publish npm package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          if npm view "jc_voronoi@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "jc_voronoi@${PACKAGE_VERSION} is already published"
          else
            npm publish ./dist/jc_voronoi
          fi

      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/jc_voronoi.zip \
            dist/jc_voronoi/jc_voronoi.wasm \
            dist/jc_voronoi/jc_voronoi.js \
            dist/jc_voronoi/voronoi.js \
            --clobber
