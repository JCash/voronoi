name: Build

on: [push, pull_request]

jobs:
  build-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build-cmake -DJC_VORONOI_BUILD_EXAMPLES=ON -DJC_VORONOI_BUILD_TESTS=ON
      - name: Build CMake targets
        run: cmake --build build-cmake --parallel
      - name: Run CMake tests
        run: ctest --test-dir build-cmake --output-on-failure
      - name: Verify CMake install
        run: cmake --install build-cmake --prefix build-cmake/install

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.3"
          actions-cache-folder: emsdk-cache
      - name: Build Wasm library
        run: ./scripts/build_wasm.sh
      - name: Run Wasm smoke test
        run: node test/wasm_smoke.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: benchmark/package-lock.json
      - name: Install benchmark dependencies
        run: npm ci --prefix benchmark
      - name: Build offline benchmark
        run: npm run build --prefix benchmark

  build-linux:
    strategy:
      matrix:
        feature: ["", "USE_ASAN=1"]
        compiler: [clang]
        arch:    ["-m64", "-m32"]
        cversion: [c99, c11, c2x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get install -y gcc-multilib g++-multilib
      - name: Build tests
        env:
          CC: ${{ matrix.compiler }}
          STDVERSION: ${{ matrix.cversion }}
          ARCH: ${{ matrix.arch }}
        run: |
          ${{ matrix.feature }} ./scripts/compile.sh
          (cd test && ${{ matrix.feature }} ./compile.sh)
          (cd src/examples && ${{ matrix.feature }} ./compile.sh)
      - name: Run Tests
        run: |
          ./build/test --test-filter issue28_
          ./build/test_double --test-filter issue28_
          ./build/simple

  build-darwin:
    strategy:
      matrix:
        feature: ["", "USE_ASAN=1"]
        compiler: [clang]
        arch:    ["-m64"]
        cversion: [c99, c11, c2x]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tests
        env:
          CC: ${{ matrix.compiler }}
          STDVERSION: ${{ matrix.cversion }}
          ARCH: ${{ matrix.arch }}
        run: |
          ${{ matrix.feature }} ./scripts/compile.sh
          (cd test && ${{ matrix.feature }} ./compile.sh)
          (cd src/examples && ${{ matrix.feature }} ./compile.sh)
      - name: Run Tests
        run: |
          ./build/test --test-filter issue28_
          ./build/test_double --test-filter issue28_
          ./build/simple

  build-windows:
    strategy:
      matrix:
        arch:       [amd64, amd64_x86] #, amd64_arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Build main
        run: scripts\compile_cl.bat
      - name: Build tests
        run: |
          cd test
          .\compile_cl.bat
      - name: Build examples
        run: |
          cd src\examples
          .\compile_cl.bat
      - name: Run Tests
        run: |
          .\build\main.exe -?
          .\build\main.exe -w 512 -h 512 -n 100 -o citest.png
          .\build\test.exe
          .\build\test_double.exe
          .\build\simple.exe
