name: Release Wasm library

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.3"
          actions-cache-folder: emsdk-cache
      - name: Build Wasm package
        env:
          WASM_OUTPUT_DIR: ../dist/jc_voronoi-wasm
        run: |
          ./scripts/build_wasm.sh dist/jc_voronoi-wasm
          node test/wasm_smoke.mjs
          cp LICENSE README.md dist/jc_voronoi-wasm/
          (cd dist && zip -r jc_voronoi-wasm.zip jc_voronoi-wasm)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jc_voronoi-wasm
          path: dist/jc_voronoi-wasm/
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            dist/jc_voronoi-wasm.zip \
            dist/jc_voronoi-wasm/jc_voronoi.wasm \
            dist/jc_voronoi-wasm/jc_voronoi.js \
            dist/jc_voronoi-wasm/voronoi.js \
            dist/jc_voronoi-wasm/voronoi.worker.js \
            --clobber
